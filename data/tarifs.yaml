      prix: 490
    - nom: "Copropriété 30 à 50 lots (2 à 3 passages / semaine)"
      detail: "Au-delà de 50 lots : sur devis après visite"
      prix: 694
    - nom: "Plus de 50 lots — sur devis après visite"
      detail: ""
      prix: 0
