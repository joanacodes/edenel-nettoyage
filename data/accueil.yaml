    items:
      - "Ménage complet : cuisine, salle de bain, sols, surfaces"
      - "Linge changé — lit fait « qualité hôtel »"
      - "Consommables réassortis (savon, papier, café)"
      - "Mise en scène du logement à l'identique"
  notif:
    titre: "Compte-rendu photos envoyé ✓"
    texte: "Intervention terminée à 14 h 47 — logement prêt pour le check-in de 16 h."
  achats:
    titre: "Accès en temps réel aux justificatifs d'achats"
    texte: "Vous accédez en temps réel aux tickets de caisse ou reçus des achats de produits, café, épicerie, …"

