bureaux:
  minHeures: 2
  ponctuel:
    - nom: "Nettoyage de bureaux"
      taux: 32
      note: "Intervention ponctuelle (petites surfaces, vitrines, remise en propreté) — minimum 2 h, + frais de déplacement 15 € HT par commande."
    - nom: "Vitrerie de bureaux (à hauteur humaine)"
      taux: 35
      note: "En supplément d'un contrat ou en ponctuel."
  contrat:
    - max: 100
      prix: 4.50
      frequence: "2 passages / semaine"
      libelle: "Petits bureaux — moins de 100 m²"
    - max: 300
      prix: 3.50
      frequence: "3 à 5 passages / semaine"
      libelle: "Bureaux de 100 à 300 m²"
  baseGrand: 2.50
  remiseAnnuelle: 0.05

copro:
  tailles:
    - nom: "Petite copropriété — moins de 10 lots (1 passage / semaine)"
      detail: "Hall, escaliers, boîtes aux lettres"
      prix: 250
